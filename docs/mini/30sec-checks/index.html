  <script>
    const CHECKS = JSON.parse(document.querySelector("#checks-data").textContent);
    const timeline = document.querySelector("#timeline");
    const panel = document.querySelector("#check-panel");
    const storagePrefix = "hama:public30sec:";
    let selectedCheck = null;
    let selectedAction = null;
    let completed = false;
    let remaining = 30;
    let timerHandle = null;

    function trackSafe(name, params) {
      try { track(name, params || {}); } catch (_) {}
    }

    function resolveInitialSlug() {
      const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
      if (hash) return hash.replace(/^check-/, "");
      const path = location.pathname;
      const legacy = CHECKS.find((item) => path.endsWith(item.legacy_path));
      if (legacy) return legacy.slug;
      return CHECKS[0]?.slug;
    }

    function storeKey(check) {
      return storagePrefix + check.issue_id;
    }

    function nowText() {
      return new Date().toLocaleString("ko-KR", { hour12: false });
    }

    function getLastResult(check) {
      try {
        return JSON.parse(localStorage.getItem(storeKey(check)) || "null");
      } catch (_) {
        return null;
      }
    }

    function saveResult(check, record) {
      localStorage.setItem(storeKey(check), JSON.stringify(record));
    }

    function renderTimeline(activeSlug) {
      timeline.innerHTML = CHECKS.map((item) => `
        <button class="timeline-card ${item.slug === activeSlug ? "active" : ""}" type="button" data-slug="${item.slug}">
          <span class="chip">${item.category}</span>
          <strong>${item.title}</strong>
          <div class="meta">${item.published_at} · ${item.target}</div>
          <p>${item.subtitle}</p>
        </button>
      `).join("");
      timeline.querySelectorAll("[data-slug]").forEach((button) => {
        button.addEventListener("click", () => {
          const slug = button.dataset.slug;
          history.replaceState(null, "", "#check-" + slug);
          selectCheck(slug);
        });
      });
    }

        <span class="chip">${check.category}</span>
        <h2>${check.title}</h2>

          <h3 id="situation-title">사전 상황</h3>
          <p>${check.situation_text}</p>
          <div class="scenario-cards">
            ${check.situation_cards.map((card) => `
              <article class="scenario-card">
                <div class="scenario-card-copy">
                  <strong>${card.title}</strong>
                  <span>${card.body}</span>
                </div>
              </article>
            `).join("")}
          </div>
        </section>

        <section class="check-room" aria-labelledby="chat-title">
          <div class="speech-fixed" title="음성 안내">음성</div>
          <h3 id="chat-title">30초점검</h3>
          <div class="chat">
            ${check.chat_preroll_turns.map((turn) => `
              <div class="chat-row ${turn.speaker === "user" ? "user" : ""}">
                <div class="avatar">${turn.label}</div>
                <div class="bubble">${turn.text}</div>
              </div>
            `).join("")}
          </div>
          <div class="final-prompt">${check.final_prompt}</div>
          <div class="response-area">
            <div class="timer-row">
              <span>${check.user_response_prompt}</span>
              <span class="timer" id="timer">${check.timer_seconds}초</span>
            </div>
            <textarea class="free-input" id="free-response" placeholder="상대에게 어떻게 대응하실 건가요? 직접 입력하거나 아래 행동을 선택하세요."></textarea>
            <div class="choices">
              ${check.action_choices.map((choice) => `
                <button class="choice" type="button" data-choice="${choice.id}">
                  <strong>${choice.label}</strong><br>
                  <span>${choice.description}</span>
                </button>
              `).join("")}
            </div>
            <div class="diagnose-row">
              <button class="small-button primary" type="button" id="diagnose">진단하기</button>
              <button class="small-button" type="button" id="reset-check">다시 선택</button>
            </div>
            <div class="history" id="history">${last ? `최근 결과: ${last.resultTitle} / ${last.completedAt}` : "이 브라우저에 저장된 최근 결과가 없습니다."}</div>
            <div class="result" id="result"></div>
          </div>
        </section>
      `;
      wireCheck(check);
    }

    function wireCheck(check) {
      selectedAction = null;
      completed = false;
      remaining = check.timer_seconds;
      if (timerHandle) window.clearInterval(timerHandle);
      const timer = panel.querySelector("#timer");
      const diagnose = panel.querySelector("#diagnose");
      const reset = panel.querySelector("#reset-check");
      panel.querySelectorAll("[data-choice]").forEach((button) => {
        button.addEventListener("click", () => {
          if (completed) return;
          selectedAction = check.action_choices.find((choice) => choice.id === button.dataset.choice);
          panel.querySelectorAll("[data-choice]").forEach((item) => item.classList.remove("selected"));
          button.classList.add("selected");
          panel.querySelector("#free-response").value = selectedAction.response_text;
          trackSafe("public_30sec_choice_selected", { issue_id: check.issue_id, choice_id: selectedAction.id, risk_level: selectedAction.risk_level });
        });
      });
      diagnose.addEventListener("click", () => {
        complete(check, selectedAction || inferFromFreeText(check), "diagnose_button");
      });
      reset.addEventListener("click", () => {
        renderCheck(check);
      });
      timerHandle = window.setInterval(() => {
        if (completed) {
          window.clearInterval(timerHandle);
          return;
        }
        remaining -= 1;
        timer.textContent = remaining + "초";
        if (remaining <= 0) {
          complete(check, { id: "timeout", label: "시간 초과", description: "아무 행동을 선택하지 않음", risk_level: "timeout", response_text: "" }, "timer");
        }
      }, 1000);
      trackSafe("public_30sec_check_view", { issue_id: check.issue_id, slug: check.slug });
    }

    function inferFromFreeText(check) {
      const text = panel.querySelector("#free-response").value.trim();
      if (!text) {
        return { id: "timeout", label: "무응답", description: "응답을 입력하지 않음", risk_level: "timeout", response_text: "" };
      }
      if (/송금|계좌|보낼|입금|링크|인증/.test(text)) {
        return check.action_choices.find((choice) => choice.risk_level === "risk") || check.action_choices[0];
      }
      if (/확인|전화|가족|멈춤|중단|공유/.test(text)) {
        return check.action_choices.find((choice) => choice.risk_level === "safe") || check.action_choices[0];
      }
      return check.action_choices.find((choice) => choice.risk_level === "caution") || check.action_choices[0];
    }

    function complete(check, action, source) {
      if (completed) return;
      completed = true;
      if (timerHandle) window.clearInterval(timerHandle);
      panel.querySelectorAll("button.choice").forEach((button) => { button.disabled = true; });
      const type = action.risk_level === "safe" ? "safe" : action.risk_level === "caution" ? "caution" : action.risk_level === "timeout" ? "timeout" : "risk";
      const resultData = check.result_screen[type];
      const record = {
        issueId: check.issue_id,
        actionId: action.id,
        actionLabel: action.label,
        resultType: type,
        resultTitle: resultData.title,
        source,
        completedAt: nowText()
      };
      saveResult(check, record);
      renderResult(check, action, resultData, type, record);
      trackSafe("public_30sec_completed", { issue_id: check.issue_id, choice_id: action.id, result_type: type, source });
    }

    function renderResult(check, action, resultData, type, record) {
      const result = panel.querySelector("#result");
      result.className = "result visible " + type;
      result.innerHTML = `
        <h3>${resultData.title}</h3>
        <p>${resultData.summary}</p>
        <p><strong>진단평가:</strong> ${resultData.diagnosis}</p>
        <p class="meta">선택/입력 요약: ${action.label} · ${record.completedAt}</p>
        <div class="result-grid">
          <div class="result-box">
            <strong>위험 신호</strong>
            <ul>${check.risk_signals.map((item) => `<li>${item}</li>`).join("")}</ul>
          </div>
          <div class="result-box">
            <strong>안전 행동</strong>
            <ul>${check.safe_actions.map((item) => `<li>${item}</li>`).join("")}</ul>
          </div>
        </div>
        <div class="result-actions">
          <button class="small-button primary" type="button" id="copy-result">결과 링크 복사</button>
          <button class="small-button" type="button" id="copy-share">가족 공유 문구 복사</button>
          <button class="small-button" type="button" id="cta-diagnosis">${check.cta.diagnosis}</button>
          <button class="small-button" type="button" id="cta-training">${check.cta.training}</button>
          <button class="small-button" type="button" id="cta-ai">${check.cta.hama_ai_experience}</button>
        </div>
      `;
      result.scrollIntoView({ behavior: "smooth", block: "start" });
      panel.querySelector("#history").textContent = `최근 결과: ${record.resultTitle} / ${record.completedAt}`;
      panel.querySelector("#copy-result").addEventListener("click", async () => {
        const url = location.origin + location.pathname + location.search + "#check-" + check.slug;
        await navigator.clipboard.writeText(url);
        trackSafe("public_30sec_result_link_copied", { issue_id: check.issue_id, result_type: type });
        alert("결과 확인 링크를 복사했습니다.");
      }, { once: true });
      panel.querySelector("#copy-share").addEventListener("click", async () => {
        const text = `${check.title} 30초점검 결과: ${record.resultTitle}. 가족끼리 기존 번호 확인 습관을 정해두세요. ${location.href}`;
        await navigator.clipboard.writeText(text);
        trackSafe("public_30sec_family_share_copied", { issue_id: check.issue_id, result_type: type });
        alert("가족 공유 문구를 복사했습니다.");
      }, { once: true });
      ["#cta-diagnosis", "#cta-training", "#cta-ai"].forEach((selector) => {
        panel.querySelector(selector).addEventListener("click", () => {
          trackSafe("public_30sec_cta_clicked", { issue_id: check.issue_id, cta: selector.replace("#cta-", "") });
          alert("현재 공개 홍보페이지에서는 CTA 클릭만 기록합니다. 실제 서비스 연결은 별도 배포 단계에서 연결합니다.");
        });
      });
    }

    function selectCheck(slug) {
      const check = CHECKS.find((item) => item.slug === slug) || CHECKS[0];
      selectedCheck = check;
      document.title = check.title + " 30초점검";
      window.HAMA_ANALYTICS.campaignId = check.campaign_id;
      window.HAMA_ANALYTICS.miniId = check.issue_id;
      renderTimeline(check.slug);
      renderCheck(check);
    }

    trackSafe("public_30sec_timeline_page_view", { page_path: location.pathname });
    selectCheck(resolveInitialSlug());
  </script>
</body>
</html>
