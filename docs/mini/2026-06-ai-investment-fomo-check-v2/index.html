  <script>
    (function () {
      var hamaWebUrl = "https://hama.thinkpool.com/TP01004T/main";
      var ctaMap = {
        "진단": "전체 사기위험 진단하기",
        "훈련": "비슷한 상황 연습하기",
        "하마터면 AI체험": "하마터면 AI로 더 알아보기",
        "다른 응답 입력": "다시 답해보기",
        "결과 링크 복사": "결과 링크 복사하기",
        "가족 공유 문구 복사": "가족에게 공유할 문구 복사"
      };
      var navLabels = new Set(["진단", "훈련", "리포트", "하마터면 돌아가기"]);

      function textOf(el) {
        return (el.textContent || "").replace(/\s+/g, " ").trim();
      }

      function isTopNavigation(el) {
        return Boolean(el.closest("header, nav"));
      }

      function setPublicCtaTarget(el, label) {
        if (el.getAttribute("data-hama-public-target-bound") === label) return;
        var targetUrl = null;
        if (label === "전체 사기위험 진단하기") {
          targetUrl = hamaWebUrl + "?utm_source=github_pages&utm_medium=public_30sec&utm_campaign=30sec_check&utm_content=diagnosis_cta";
        } else if (label === "비슷한 상황 연습하기") {
          targetUrl = hamaWebUrl + "?utm_source=github_pages&utm_medium=public_30sec&utm_campaign=30sec_check&utm_content=training_cta";
        } else if (label === "하마터면 AI로 더 알아보기") {
          targetUrl = hamaWebUrl + "?utm_source=github_pages&utm_medium=public_30sec&utm_campaign=30sec_check&utm_content=hama_web_cta";
        }

        if (targetUrl) {
          if (el.tagName === "A") {
            el.setAttribute("href", targetUrl);
            el.setAttribute("target", "_blank");
            el.setAttribute("rel", "noopener noreferrer");
          }
          el.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
            window.open(targetUrl, "_blank", "noopener,noreferrer");
          }, true);
          el.setAttribute("data-hama-public-target-bound", label);
          return;
        }

        if (label === "다시 답해보기") {
          el.addEventListener("click", function (event) {
            event.preventDefault();
            event.stopImmediatePropagation();
            window.location.hash = "#/issue-check";
            window.location.reload();
          }, true);
          el.setAttribute("data-hama-public-target-bound", label);
        }
      }

      function applyPromoShell() {
        document.body.classList.add("hama-public-promo");

        document.querySelectorAll("header a, header button, nav a, nav button").forEach(function (el) {
          if (navLabels.has(textOf(el))) {
            el.style.display = "none";
            el.setAttribute("aria-hidden", "true");
            el.setAttribute("tabindex", "-1");
          }
        });

        document.querySelectorAll("a, button").forEach(function (el) {
          if (isTopNavigation(el)) return;
          var label = textOf(el);
          if (Object.prototype.hasOwnProperty.call(ctaMap, label)) {
            el.textContent = ctaMap[label];
            el.setAttribute("data-hama-public-cta", "renamed");
            setPublicCtaTarget(el, ctaMap[label]);
          } else if (el.getAttribute("data-hama-public-cta") === "renamed") {
            setPublicCtaTarget(el, label);
          }
        });

        if (!document.querySelector(".hama-public-timeline-link")) {
          var link = document.createElement("a");
          link.className = "hama-public-timeline-link";
          link.href = "../30sec-checks/";
          link.textContent = "다른 30초점검 보기";
          document.body.appendChild(link);
        }
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", applyPromoShell);
      } else {
        applyPromoShell();
      }
      new MutationObserver(applyPromoShell).observe(document.documentElement, {
        childList: true,
        subtree: true
      });
    })();
  </script>
  </head>
