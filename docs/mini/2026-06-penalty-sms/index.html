<script>

let selectedAction = null, completed = false, remaining = 30, timerHandle = null;
function trackSafe(name, params){ try{ track(name, params || {}); } catch(_){} }
function resolveInitialSlug(){
  const hash = decodeURIComponent(location.hash.replace(/^#/, ""));
  if (hash) return hash.replace(/^check-/, "");
  const path = location.pathname;
  const legacy = CHECKS.find((item) => path.endsWith(item.legacy_path));
  if (legacy) return legacy.slug;
  return CHECKS[0]?.slug;
}
function storeKey(check){ return storagePrefix + check.issue_id; }
function nowText(){ return new Date().toLocaleString("ko-KR", { hour12:false }); }
function getLastResult(check){ try{ return JSON.parse(localStorage.getItem(storeKey(check)) || "null"); }catch(_){ return null; } }
function saveResult(check, record){ localStorage.setItem(storeKey(check), JSON.stringify(record)); }
function renderTimeline(activeSlug){
  timeline.innerHTML = CHECKS.map((item)=>`
    <button class="timeline-card ${item.slug === activeSlug ? "active" : ""}" type="button" data-slug="${item.slug}">
      <span class="chip">${item.category}</span>
      <strong>${item.title}</strong>
      <div class="meta">${item.published_at} · ${item.target}</div>
      <p>${item.subtitle}</p>
    </button>`).join("");
  timeline.querySelectorAll("[data-slug]").forEach((button)=>button.addEventListener("click",()=>{
    const slug = button.dataset.slug;
    history.replaceState(null, "", "#check-" + slug);
    selectCheck(slug);
  }));
}
function renderCheck(check){
  const last = getLastResult(check);

}
function wireCheck(check){
  selectedAction = null; completed = false; remaining = check.timer_seconds;
  if (timerHandle) window.clearInterval(timerHandle);
  const timer = panel.querySelector("#timer");
  panel.querySelectorAll("[data-choice]").forEach((button)=>{
    button.addEventListener("click",()=>{
      if (completed) return;
      selectedAction = check.action_choices.find((choice)=>choice.id === button.dataset.choice);
      panel.querySelectorAll("[data-choice]").forEach((item)=>item.classList.remove("selected"));
      button.classList.add("selected");
      panel.querySelector("#free-response").value = selectedAction.response_text || selectedAction.description;
      trackSafe("public_30sec_choice_selected", { issue_id:check.issue_id, choice_id:selectedAction.id, risk_level:selectedAction.risk_level });
    });
  });
  panel.querySelector("#diagnose").addEventListener("click",()=>complete(check, selectedAction || inferFromFreeText(check), "diagnose_button"));
  panel.querySelector("#reset-check").addEventListener("click",()=>renderCheck(check));
  timerHandle = window.setInterval(()=>{
    if (completed){ window.clearInterval(timerHandle); return; }
    remaining -= 1; timer.textContent = remaining + "초";
    if (remaining <= 0) complete(check, { id:"timeout", label:"시간 초과", description:"아무 행동을 선택하지 않음", risk_level:"timeout", response_text:"" }, "timer");
  }, 1000);
  trackSafe("public_30sec_check_view", { issue_id:check.issue_id, slug:check.slug });
}
function inferFromFreeText(check){
  const text = panel.querySelector("#free-response").value.trim();
  if (!text) return { id:"timeout", label:"무응답", description:"응답을 입력하지 않음", risk_level:"timeout", response_text:"" };
  if (/송금|계좌|보낼|입금|링크|인증|결제|입력|누르/.test(text)) return check.action_choices.find((choice)=>choice.risk_level === "risk") || check.action_choices[0];
  if (/확인|전화|가족|멈춤|중단|공식|사이트|앱|공유/.test(text)) return check.action_choices.find((choice)=>choice.risk_level === "safe") || check.action_choices[0];
  return check.action_choices.find((choice)=>choice.risk_level === "caution") || check.action_choices[0];
}
function complete(check, action, source){
  if (completed) return; completed = true; if (timerHandle) window.clearInterval(timerHandle);
  panel.querySelectorAll("button.choice").forEach((button)=>{ button.disabled = true; });
  const type = action.risk_level === "safe" ? "safe" : action.risk_level === "caution" ? "caution" : action.risk_level === "timeout" ? "timeout" : "risk";
  const resultData = check.result_screen[type];
  const record = { issueId:check.issue_id, actionId:action.id, actionLabel:action.label, resultType:type, resultTitle:resultData.title, source, completedAt:nowText() };
  saveResult(check, record); renderResult(check, action, resultData, type, record);
  trackSafe("public_30sec_completed", { issue_id:check.issue_id, choice_id:action.id, result_type:type, source });
}
function renderResult(check, action, resultData, type, record){
  const result = panel.querySelector("#result");
  result.className = "result visible " + type;
  result.innerHTML = `
    <h3>${resultData.title}</h3><p>${resultData.summary}</p><p><strong>진단평가:</strong> ${resultData.diagnosis}</p>
    <p class="meta">선택/입력 요약: ${action.label} · ${record.completedAt}</p>
    <div class="result-grid"><div class="result-box"><strong>위험 신호</strong><ul>${check.risk_signals.map((item)=>`<li>${item}</li>`).join("")}</ul></div>
    <div class="result-box"><strong>안전 행동</strong><ul>${check.safe_actions.map((item)=>`<li>${item}</li>`).join("")}</ul></div></div>
    <div class="result-actions"><button class="small-button primary" type="button" id="copy-result">결과 링크 복사</button><button class="small-button" type="button" id="copy-share">가족 공유 문구 복사</button><button class="small-button" type="button" id="cta-diagnosis">${check.cta.diagnosis}</button><button class="small-button" type="button" id="cta-training">${check.cta.training}</button><button class="small-button" type="button" id="cta-ai">${check.cta.hama_ai_experience}</button><button class="small-button" type="button" id="cta-other">${check.cta.other_checks}</button></div>`;
  result.scrollIntoView({ behavior:"smooth", block:"start" });
  panel.querySelector("#history").textContent = `최근 결과: ${record.resultTitle} / ${record.completedAt}`;
  panel.querySelector("#copy-result").addEventListener("click", async()=>{ await navigator.clipboard.writeText(location.href.split("#")[0] + "#check-" + check.slug); alert("결과 확인 링크를 복사했습니다."); }, { once:true });
  panel.querySelector("#copy-share").addEventListener("click", async()=>{ await navigator.clipboard.writeText(`${check.title} 30초점검 결과: ${record.resultTitle}. 가족끼리 공식 경로 확인 습관을 정해두세요. ${location.href}`); alert("가족 공유 문구를 복사했습니다."); }, { once:true });
  const ctaTargets = {
    "#cta-diagnosis": check.cta.diagnosis_url,
    "#cta-training": check.cta.training_url,
    "#cta-ai": check.cta.hama_ai_experience_url,
    "#cta-other": "https://vongchu.github.io/sample_hamat-mini-experience/mini/30sec-checks/"
  };
  Object.entries(ctaTargets).forEach(([selector, url])=>panel.querySelector(selector).addEventListener("click",()=>{ 
    trackSafe("public_30sec_cta_clicked", { issue_id:check.issue_id, cta:selector.replace("#cta-","") });
    window.location.href = url;
  }));
}
function selectCheck(slug){
  const check = CHECKS.find((item)=>item.slug === slug) || CHECKS[0];
  document.title = (check.check_title || check.title) + " 30초점검";
  window.HAMA_ANALYTICS.campaignId = check.campaign_id; window.HAMA_ANALYTICS.miniId = check.issue_id;
  renderTimeline(check.slug); renderCheck(check);
}
trackSafe("public_30sec_page_view", { page_path:location.pathname });
selectCheck(resolveInitialSlug());
</script>
</body>
